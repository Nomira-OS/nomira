name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@6f634847008ee3b3d30fcb84095b79b9a3bb1da7 # main

  go:
    uses: Nomira-OS/ci/.github/workflows/go.yml@6f634847008ee3b3d30fcb84095b79b9a3bb1da7 # main
    with:
      trivy: true
      extra: |
        sh hack/test_lister.sh
        sh hack/test_guard.sh

  # Builds small recipes with a real BuildKit: conflicts, deletions,
  # collectors, imports (also by URL), mounts, and that groups without run survive a new base
  # image. See hack/e2e.sh.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_VERSION: v0.35.1
      # renovate: datasource=docker depName=registry
      REGISTRY_VERSION: 3.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start a registry and BuildKit
        run: |
          # The frontend under test is pushed to a registry on localhost;
          # BuildKit has to be told that it speaks plain HTTP.
          docker run -d --name registry --network host "registry:${REGISTRY_VERSION}"
          printf '[registry."localhost:5000"]\n  http = true\n  insecure = true\n' > "${RUNNER_TEMP}/buildkitd.toml"
          # Imports by URL: a plain web server for the case url_import.
          mkdir -p "${RUNNER_TEMP}/http"
          (cd "${RUNNER_TEMP}/http" && nohup python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          docker run -d --name buildkitd --privileged --network host \
            -v "${RUNNER_TEMP}/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro" \
            -v "${RUNNER_TEMP}/http:/http" \
            -v "${PWD}:/src:ro" \
            "moby/buildkit:${BUILDKIT_VERSION}"
          for i in $(seq 1 30); do
            docker exec buildkitd buildctl debug workers >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs buildkitd
          exit 1
      - name: Build the frontend under test
        run: |
          docker exec buildkitd buildctl build \
            --frontend dockerfile.v0 \
            --local context=/src --local dockerfile=/src \
            --opt filename=Dockerfile.frontend \
            --output type=image,name=localhost:5000/nomira:e2e,push=true
      - name: Run the end-to-end tests
        run: |
          docker exec -e FRONTEND=localhost:5000/nomira:e2e \
            -e HTTP_DIR=/http -e HTTP_URL=http://127.0.0.1:8099 \
            buildkitd sh /src/hack/e2e.sh
      - name: BuildKit log
        if: failure()
        run: docker logs --tail 200 buildkitd

  # The short commit hash, as arch-base uses it: sha-1a2b3c4.
  tag:
    runs-on: ubuntu-26.04
    outputs:
      sha-tag: ${{ steps.t.outputs.sha-tag }}
    steps:
      - id: t
        run: echo "sha-tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Every commit on main is published as an immutable development build,
  # sha-<short commit>. Releases are cut by hand with the release workflow.
  image:
    needs: [go, e2e, tag]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: Nomira-OS/ci/.github/workflows/image.yml@6f634847008ee3b3d30fcb84095b79b9a3bb1da7 # main
    with:
      image: ghcr.io/nomira-os/nomira
      file: Dockerfile.frontend
      platforms: linux/amd64,linux/arm64
      fail-on-vulnerabilities: true
      tags: |
        ${{ needs.tag.outputs.sha-tag }}
        latest
      build-args: VERSION=${{ needs.tag.outputs.sha-tag }}
      push: ${{ github.event_name != 'pull_request' }}
