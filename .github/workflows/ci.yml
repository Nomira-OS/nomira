name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@main

  go:
    uses: Nomira-OS/ci/.github/workflows/go.yml@main
    with:
      trivy: true
      extra: |
        sh hack/test_lister.sh
        sh hack/test_guard.sh
        go run ./cmd/frontend lint examples/recipe.yml

  # Every commit on main is published as an immutable development build,
  # sha-<commit>. Releases are cut by hand with the release workflow.
  image:
    needs: go
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: Nomira-OS/ci/.github/workflows/image.yml@main
    with:
      image: ghcr.io/nomira-os/nomira
      file: Dockerfile.frontend
      platforms: linux/amd64,linux/arm64
      fail-on-vulnerabilities: true
      tags: sha-${{ github.sha }}
      push: ${{ github.event_name != 'pull_request' }}
