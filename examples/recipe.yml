# syntax=ghcr.io/nomira-os/nomira:1-alpha
#
# Example: a small system on the nomira base image.
#
# Every feature is a group in a file of its own. A group names the packages
# and services it needs; the collector phases install and enable them in
# one step each. The groups themselves only copy files, so they do not see
# the state before them: a new base image rebuilds the two collectors, not
# the features.
#
# The package set comes from the base image: its mirrorlist points to the
# Arch Linux Archive snapshot that belongs to the tag.

settings:
  name: mysystem
  description: Example system with kmscon, NetworkManager and AppArmor
  base: ghcr.io/nomira-os/arch-base:2026.11.13
  labels:
    org.opencontainers.image.source: https://github.com/Nomira-OS/nomira
  env:
    LANG: C.UTF-8

phases:
  - name: packages
    collect: run --mount=type=cache,target=/usr/lib/sysimage/cache/pacman/pkg pacman -S --needed --noconfirm ${items}

  - name: features
    groups:
      terminal: {include: features/terminal.yml}
      network: {include: features/network.yml}
      boot:
        - copy files/kargs/ /usr/lib/bootc/kargs.d/

  - name: services
    collect: run systemctl enable ${items}
