# syntax=ghcr.io/nomira-os/nomira:1
#
# Beispiel: ein kleines System auf dem nomira-Basis-Image. Gruppen innerhalb
# einer Phase sind deklariert unabhängig und werden im Build auf
# Disjunktheit geprüft.
#
# Der Paketstand kommt vom Basis-Image: Dessen mirrorlist zeigt auf den
# Snapshot im Arch Linux Archive, der zum Tag gehört.

settings:
  name: meinsystem
  description: Beispielsystem mit kmscon, NetworkManager und AppArmor
  base: ghcr.io/nomira-os/nomira-image:2026.11.13
  validation: strict
  labels:
    org.opencontainers.image.source: https://github.com/Nomira-OS/nomira
  env:
    LANG: C.UTF-8

phases:
  - name: packages
    groups:
      system:
        - run --mount=type=cache,target=/usr/lib/sysimage/cache/pacman/pkg pacman -S --needed --noconfirm kmscon networkmanager

  - name: configs
    groups:
      kmscon:
        - copy --chmod=0644 files/kmscon/ /etc/kmscon/
      networkmanager:
        - copy --chmod=0600 files/nm/ /etc/NetworkManager/system-connections/
      boot:
        - copy files/kargs/ /usr/lib/bootc/kargs.d/

  - name: finish
    groups:
      enable:
        - run systemctl enable kmsconvt@tty1.service NetworkManager.service
