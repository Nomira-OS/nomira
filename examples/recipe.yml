# syntax=ghcr.io/nomira-os/nomira:1-alpha
#
# Example: a small system on the nomira base image. Groups within a phase
# are declared independent, and the build verifies that their write sets
# are disjoint.
#
# The package set comes from the base image: its mirrorlist points to the
# Arch Linux Archive snapshot that belongs to the tag.

settings:
  name: mysystem
  description: Example system with kmscon, NetworkManager and AppArmor
  base: ghcr.io/nomira-os/nomira-image:2026.11.13
  validation: strict
  labels:
    org.opencontainers.image.source: https://github.com/Nomira-OS/nomira
  env:
    LANG: C.UTF-8

phases:
  - name: packages
    groups:
      system:
        - run --mount=type=cache,target=/usr/lib/sysimage/cache/pacman/pkg pacman -S --needed --noconfirm kmscon networkmanager

  - name: configs
    groups:
      kmscon:
        - copy --chmod=0644 files/kmscon/ /etc/kmscon/
      networkmanager:
        - copy --chmod=0600 files/nm/ /etc/NetworkManager/system-connections/
      boot:
        - copy files/kargs/ /usr/lib/bootc/kargs.d/

  - name: finish
    groups:
      enable:
        - run systemctl enable kmsconvt@tty1.service NetworkManager.service
